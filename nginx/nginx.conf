worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 128k;                 # the app rejects bigger bodies anyway

  gzip on; gzip_min_length 1024; gzip_vary on; gzip_comp_level 5;
  gzip_proxied any;
  gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml;

  # First line of defence, before Node is touched: 300 AI requests/min per IP (burst 40). The app has its own limits.
  # Raised for events: a whole venue on one shared Wi-Fi IP would otherwise throttle itself.
  limit_req_zone $binary_remote_addr zone=ai:10m rate=300r/m;
  limit_req_zone $binary_remote_addr zone=web:10m rate=600r/m;   # pages and static files: generous, only stops floods

  # HSTS only when the request reached us over https (Cloudflare tunnel / TLS proxy sets X-Forwarded-Proto), so http://localhost is never pinned.
  map $http_x_forwarded_proto $hsts { https "max-age=31536000; includeSubDomains"; default ""; }

  # Static files are cached here so the Node app is hit rarely (the URLs carry ?v=, which is part of the cache key).
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=100m inactive=1h use_temp_path=off;
  limit_req_status 429;

  resolver 127.0.0.11 valid=10s ipv6=off;    # Docker's DNS: lets `docker compose up --scale app=2` spread requests

  # Behind a Cloudflare tunnel every request comes from a cloudflared container; take the visitor IP from CF-Connecting-IP
  # (only trusted when the peer is on a Docker network), so rate limits are per visitor, not shared.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;   # the page has its own meta CSP for scripts
    add_header Strict-Transport-Security $hsts always;

    location ~ /\. { return 404; }           # never serve dotfiles

    location /api/ai {
      limit_req zone=ai burst=40 nodelay;
      set $up http://app:8787;
      proxy_pass $up;
      proxy_read_timeout 75s;                # the app waits up to 60 s for the model
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # the app trusts the LAST entry, i.e. the one added here
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz { return 404; }      # Docker's HEALTHCHECK talks to the app directly; not exposed here

    location / {
      limit_req zone=web burst=200 nodelay;
      set $up http://app:8787;
      proxy_pass $up;
      proxy_cache static;
      proxy_cache_revalidate on;
      proxy_cache_valid 200 1h;
      proxy_cache_use_stale error timeout updating;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header Strict-Transport-Security $hsts always;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---- HTTPS: put fullchain.pem and privkey.pem in nginx/certs, then (1) in the server above replace `location /`
  # and the others with the redirect below, and (2) uncomment this block. See README.md.
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name your-domain.example;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   add_header Strict-Transport-Security "max-age=31536000" always;
  #   ... same location blocks as the port-80 server ...
  # }
  # Redirect for port 80 once HTTPS works:   location / { return 301 https://$host$request_uri; }
}

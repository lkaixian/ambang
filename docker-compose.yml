# AMBANG: nginx (public) -> app (Node) -> redis (shared cache + limits). Only nginx is reachable from outside.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env # ILMU_API_KEY, ILMU_MODEL, limits... (copy .env.example to .env first)
    environment:
      REDIS_URL: redis://:${REDIS_PASS:?set REDIS_PASS in .env}@redis:6379 # use a URL-safe password (letters and digits)
      CACHE_FILE: /cache/ai_cache.json # writable volume: the rest of the container is read-only
      TRUST_PROXY: "1" # the app sits behind nginx, so read the client IP from X-Forwarded-For
    depends_on: [ redis ]
    expose: [ "8787" ] # internal only, no published port
    read_only: true
    tmpfs: [ /tmp ]
    volumes: [ "ai-cache:/cache" ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 256m
    pids_limit: 100

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # cache + counters only. maxmemory + LRU means it can never grow without bound; AOF keeps the cache across restarts.
    command: [ "redis-server", "--requirepass", "${REDIS_PASS:?set REDIS_PASS in .env}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes" ]
    volumes: [ redis-data:/data ] # no published port: only the app can reach it
    cap_drop: [ ALL ]
    cap_add: [ CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER ] # the entrypoint chowns /data, then drops to the redis user
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 192m
    pids_limit: 50

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: [ "${BIND_IP:-127.0.0.1}:80:80", "${BIND_IP:-127.0.0.1}:443:443" ] # default loopback only: the LAN cannot reach nginx directly (cloudflared uses the docker network)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    tmpfs: [ /var/cache/nginx/static:size=128m ] # static proxy_cache lives in RAM
    depends_on: [ app ]
    cap_drop: [ ALL ]
    cap_add: [ NET_BIND_SERVICE, CHOWN, SETUID, SETGID ] # bind :80, then workers drop to the nginx user
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 192m
    pids_limit: 100

  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [ nginx ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 128m
    pids_limit: 50

networks:
  default:
    name: ambang_net # fixed name: other projects join it with `external: true` instead of AMBANG joining theirs

volumes:
  redis-data:
  ai-cache:
